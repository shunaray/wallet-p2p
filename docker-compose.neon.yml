# Override to run the wallet-service against Neon cloud PostgreSQL.
# Usage:
#   export DB_URL="jdbc:postgresql://<host>/neondb?sslmode=require&channel_binding=require"
#   export DB_USER="neondb_owner"
#   export DB_PASSWORD="<your-password>"
#   docker compose -f docker-compose.yml -f docker-compose.neon.yml up --build -d
#
# The local postgres service is excluded; only the app starts,
# connecting directly to Neon via SSL.

services:
  postgres:
    profiles:
      - local-only          # excluded when this override is active

  app:
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      HIKARI_MAX_POOL_SIZE: 10
    depends_on: {}          # remove dependency on local postgres
